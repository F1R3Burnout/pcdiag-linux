name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
      - run: python -m pcdiag stability --dry-run
      - run: sudo python -m pcdiag stability --profile quick --load-seconds 3 --components cpu,memory,storage,kernel --no-install --no-download --output /tmp/pcdiag-ci
      - run: python -m pcdiag sysdiag --no-install --zip --output /tmp/pcdiag-ci-system
      - run: python -m pcdiag netdiag --no-install --lan-only --output /tmp/pcdiag-ci-network
      - run: python -m pcdiag displaydiag --no-install --output /tmp/pcdiag-ci-display
      - run: shellcheck install.sh
