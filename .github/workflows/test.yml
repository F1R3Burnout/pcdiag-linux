name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
      - run: python -m pcdiag stability --dry-run
      - run: sudo python -m pcdiag stability --profile quick --components cpu,memory,storage,kernel --output /tmp/pcdiag-ci
      - run: shellcheck install.sh
